<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Atomus, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'at-stack'},
 h(A.Tabs,{'aria-label':'Underline',items:[{value:'o',label:'Overview'},{value:'a',label:'Analytics',count:12},{value:'r',label:'Reports'},{value:'s',label:'Settings'}]}),
 h(A.Tabs,{variant:'pill','aria-label':'Pill',items:[{value:'o',label:'Overview'},{value:'a',label:'Analytics'},{value:'r',label:'Reports'}]}),
 h(A.Tabs,{variant:'segmented','aria-label':'Range',items:[{value:'d',label:'Day'},{value:'w',label:'Week'},{value:'m',label:'Month'}],defaultValue:'w'})));
</script>
</body>
</html>
