<!doctype html>
<html>
<head><meta charset="utf-8"><title>MetricCard — preview</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Atomus, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'at-grid'},
 h(A.MetricCard,{label:'Monthly revenue',value:'$48.2k',change:'12%',caption:'vs last month'}),
 h(A.MetricCard,{label:'Active users',value:'2,940',change:'4.1%',caption:'vs last week'}),
 h(A.MetricCard,{label:'Churn',value:'1.8%',change:'-0.4%',trend:'down',caption:'vs last month'})));
</script>
</body>
</html>
