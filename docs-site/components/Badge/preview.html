<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root"></div>
<script>
  var A = window.Atomus, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'at-stack'},
 h('div',{className:'at-row'},
  h(A.Badge,{color:'gray'},'Draft'),
  h(A.Badge,{color:'brand'},'New'),
  h(A.Badge,{color:'success',dot:true},'Active'),
  h(A.Badge,{color:'warning',dot:true},'Pending'),
  h(A.Badge,{color:'error',dot:true},'Overdue')),
 h('div',{className:'at-row'},
  h(A.Badge,{color:'gray',variant:'solid'},'Gray'),
  h(A.Badge,{color:'brand',variant:'solid'},'Brand'),
  h(A.Badge,{color:'error',variant:'solid'},'Error'),
  h(A.Badge,{color:'success',variant:'solid'},'Success')),
 h('div',{className:'at-row'},
  h(A.Badge,{color:'brand',size:'sm'},'sm'),
  h(A.Badge,{color:'brand',size:'md'},'md'),
  h(A.Badge,{color:'brand',size:'lg',onClose:function(){}},'lg'))));
</script>
</body>
</html>
