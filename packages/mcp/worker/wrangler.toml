# Atomus MCP server — remote, read-only, Streamable HTTP at https://mcp.atomus.io/mcp
# Deploy (owner): see packages/mcp/README.md → "Remote server". Do not deploy from CI without review.
name = "atomus-mcp"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
minify = true

# Custom domain. Requires the atomus.io zone on the same Cloudflare account; Cloudflare creates the DNS record.
routes = [
  { pattern = "mcp.atomus.io", custom_domain = true }
]

[observability]
enabled = true

# The bundled data (manifest, guidelines, patterns, templates) is imported as JSON at build time:
# run `npm run build:data` in packages/mcp before `wrangler dev` / `wrangler deploy` (the npm scripts do it).

# TypeScript (used by @typescript-eslint/parser in atomus_validate) probes the Node system on load.
[define]
__filename = "'/worker/index.js'"
__dirname = "'/worker'"
