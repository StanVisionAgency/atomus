name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    name: React package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck (components + Code Connect templates)
        run: npm run typecheck
      - run: npm run build
      - name: Code Connect templates parse and render (no Figma token needed)
        run: npm run figma:check
      - name: Package contents
        run: npm pack --dry-run

  tokens:
    name: Tokens package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
