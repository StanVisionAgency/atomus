# Publishes @stanvision/atomus-react, @stanvision/atomus-tokens, @stanvision/atomus-manifest,
# @stanvision/eslint-plugin-atomus, @stanvision/stylelint-config-atomus and @stanvision/atomus-mcp to npm.
#
# One-time setup by the repo owner:
#   1. Create the npm organisation "stanvision" (https://www.npmjs.com/org/create) so the @stanvision scope exists.
#   2. Create an npm granular access token with read/write access to the @stanvision scope
#      and add it as the repository secret NPM_TOKEN (Settings > Secrets and variables > Actions).
#   3. npm provenance (--provenance) needs a public GitHub repository; it uses the id-token permission below.
#
# Release: push a tag such as v4.1.0 (git tag v4.1.0 && git push origin v4.1.0). The tag sets the version of every
# package. "Run workflow" (workflow_dispatch) publishes the versions in package.json, or does a dry run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm publish --dry-run)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PUBLISH_FLAGS: --provenance --access public${{ inputs.dry_run && ' --dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is missing. See the setup notes at the top of release.yml."
            exit 1
          fi

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in react packages/tokens packages/manifest packages/eslint-plugin packages/stylelint-config packages/mcp; do
            (cd "$dir" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done

      - name: Build and test @stanvision/atomus-react
        working-directory: react
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build and test the manifest, lint packages and MCP server
        run: |
          (cd packages/manifest && npm install --no-audit --no-fund && node ../../scripts/build-manifest.mjs)  # regenerate: the tag changed the version
          (cd packages/eslint-plugin && npm install --no-audit --no-fund && npm test)
          (cd packages/stylelint-config && npm install --no-audit --no-fund && npm test)
          (cd packages/mcp && npm install --no-audit --no-fund && npm run typecheck && npm test)

      - name: Publish @stanvision/atomus-tokens
        working-directory: packages/tokens
        run: npm publish $PUBLISH_FLAGS

      - name: Publish @stanvision/atomus-react
        working-directory: react
        run: npm publish $PUBLISH_FLAGS

      - name: Publish @stanvision/atomus-manifest
        working-directory: packages/manifest
        run: npm publish $PUBLISH_FLAGS

      - name: Publish @stanvision/eslint-plugin-atomus
        working-directory: packages/eslint-plugin
        run: npm publish $PUBLISH_FLAGS

      - name: Publish @stanvision/stylelint-config-atomus
        working-directory: packages/stylelint-config
        run: npm publish $PUBLISH_FLAGS

      - name: Publish @stanvision/atomus-mcp
        working-directory: packages/mcp
        run: npm publish $PUBLISH_FLAGS

      # The remote MCP server (mcp.atomus.io) is deployed by hand after a release: see packages/mcp/README.md.
