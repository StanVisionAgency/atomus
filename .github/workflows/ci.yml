name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    name: React package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck (components + Code Connect templates)
        run: npm run typecheck
      - run: npm run build
      - name: Code Connect templates parse and render (no Figma token needed)
        run: npm run figma:check
      - name: Package contents
        run: npm pack --dry-run

  tokens:
    name: Tokens package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  manifest:
    name: Component manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Manifest is up to date and matches the JSON Schema
        run: node ../../scripts/build-manifest.mjs --check
      - name: Package contents
        run: npm pack --dry-run

  lint-packages:
    name: ESLint plugin and Stylelint config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ESLint plugin — RuleTester suites
        working-directory: packages/eslint-plugin
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: ESLint plugin — lint react/src (strict)
        working-directory: packages/eslint-plugin
        run: npm run lint:repo
      - name: Stylelint config — tests
        working-directory: packages/stylelint-config
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Stylelint config — lint react/src/styles.css
        working-directory: packages/stylelint-config
        run: npm run lint:repo
      - name: Package contents
        run: |
          (cd packages/eslint-plugin && npm pack --dry-run)
          (cd packages/stylelint-config && npm pack --dry-run)

  mcp:
    name: Atomus MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Build, then call every tool over stdio and through the Worker (wrangler dev)
        run: npm test
      - name: Worker bundle fits the Workers size limit (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/atomus-worker -c worker/wrangler.toml
      - name: Package contents
        run: npm pack --dry-run

  registry:
    name: shadcn registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: registry.json is up to date (react/src, css/, shadcn/, docs sections → registry/)
        run: npm run check
      - name: Generate sources and shadcn build
        run: npm run build -- --output ../dist-registry/r
      - name: Type-check the registry sources (generated copies + app blocks)
        run: npm run typecheck
      - name: Validate every item against the shadcn schema
        run: npm run validate -- ../dist-registry/r
      - name: Install the theme, every component and every block into a fresh Vite + Tailwind v4 app and build it
        run: npm run test:install

  storybook:
    name: Storybook (build, a11y, visual)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Type-check stories, Storybook config and tests
        run: npm run typecheck:storybook
      - name: Build Storybook (with the component manifest)
        run: npm run build-storybook
      - name: Component manifest exists
        run: test -s storybook-static/manifests/components.json
      - name: Stories, play functions and axe checks (test-runner; fails on any a11y violation)
        run: npm run test-storybook
      - name: Visual regression (every story × light/dark × atomus/violet)
        run: npm run test:visual
      - name: Upload new or changed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshots
          path: |
            react/tests/__screenshots__/
            react/test-results/
            react/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
